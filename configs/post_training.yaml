experiment_name: qwen3-financial-sft-unsloth-dpo
seed: 42

model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  max_seq_length: 2048
  load_in_4bit: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05

data:
  dataset_name: next-tat/TAT-QA
  train_path: data/sft_train.jsonl
  validation_path: data/sft_validation.jsonl
  preference_path: data/dpo_train.jsonl
  max_context_chars: 6000
  max_samples: null
  validation_fraction: 0.05

sft:
  output_dir: outputs/qwen3-financial-sft
  epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  max_steps: -1

dpo:
  output_dir: outputs/qwen3-financial-dpo
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.00005
  beta: 0.1
  max_length: 2048
  max_prompt_length: 1536

mlflow:
  tracking_uri: null
  experiment: /Shared/qwen3-financial-sft-unsloth-dpo
